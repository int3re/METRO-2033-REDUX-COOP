; metronet: network co-op for the story of Metro 2033 Redux. This file sits next to metro.exe.

[net]
; Nothing here has to be changed to play together through Steam: with "auto" the game sorts the roles out itself.
;   auto - whoever plays the story can be joined by Steam friends (the level becomes a network game when the
;          first of them comes in). A game that stands in the main menu while a friend plays asks its player,
;          in the game's own window, whether to join.
;   off  - the game as it is, the mod does nothing.
;   host / join - a fixed role for the whole run; needed only to play by IP address (see address).
mode = auto
; mode = join only: the host's IP address (one home network, a VPN, or UDP port 1000 forwarded at the host),
; or "steam" for a Steam friend's game.
address =
steam = 1           ; 0: Steam is never touched (IP address only)
revive = 1          ; 0: a player dies as in single player (1: falls wounded, a teammate raises them; the checkpoint
                    ;    is loaded for everybody only when everybody is down)
motions = 1         ; 0: the joined games do not move the level's things as the host's do (doors a story character
                    ;    opens, gates, levers)
loot = 1            ; 0: loot one for all (1: every player takes their own: what one took stays for the others;
                    ;    an enemy's weapon stays one for all)
physics = 1         ; 0: crates, barrels and other loose things lie where each PC's own physics put them
own_gear = 1        ; 0: a joined player's next body (a level change, a death) carries the host's rounds and money
motions_back2 = 1   ; 0: a thing a joined player moved (a door, a cabinet, a lever within 10 m) does not move on the host
use_scene = 1       ; 0: another player's "use" played here brings its scene (camera, hands) onto this PC's player too
use_on_joined = 0   ; 1: a joined game plays the others' uses too (0.4.2: the host's wheel pulled both players)
use_on_host2 = 1    ; 0: the host does not play a joined player's uses (its story then never learns of them); when it
                    ;    does, the use's scene is only finished there, never played on the host's player
drive = 1           ; 0: a wheel held and turned is turned on each PC by that PC's own player alone (before 0.4.6);
                    ;    1: one player turns it, the others cannot use it meanwhile, and every PC's copy turns alike
menu = 1            ; 0: no "NETWORK GAME" label on the main menu's desk and no network page
borderless = 0      ; 1: the game in a window is shown without a frame over the whole monitor (the launcher's
                    ;    "Режим экрана: Без рамки"; the game's own full screen must be off)
names = 1           ; 0: the other players' names are not shown over their heads
name =              ; your name for the other players when Steam is not running (with Steam it is your Steam name)
body_delay = 2      ; host: seconds between a joined game being ready and its player's body
timeout = 45        ; seconds a PC that sends nothing is waited for before it is taken for gone (set the same on all PCs)
tree_lock = 1       ; 0: the game's own way of locking its collision tree (it can lock the game up for good in a long fight)
friendly_fire = 0   ; 1: the players' bullets hurt each other (set the same on both PCs)
ride = 1            ; 0: a joined player is not seated beside the host on a handcar or another vehicle
zones = 1           ; 0: a level's "the player walked in" zones wait for each PC's own player only
zone_own = 1        ; 0: what a zone does to the player (civil mode at a station, the gas mask, fire, a lift) reaches
                    ;    everybody when anybody walks in (1: only the player who walked in)
use = 1             ; 0: a door / lever / talk a player used is used on that player's PC only

[video]
print_screen = 1    ; 0: Print Screen is left to the system (in full screen it copies nothing)

[log]
level = info        ; error / warn / info / debug
engine = 1          ; the game's own log lines go into metronet.log too
